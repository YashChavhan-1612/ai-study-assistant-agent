services:
  # Backend — FastAPI Python Web Service
  - type: web
    name: ai-study-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard — never commit
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: FRONTEND_ORIGIN
        fromService:
          name: ai-study-frontend
          type: web
          property: host
      - key: MAX_UPLOAD_MB
        value: "10"

  # Frontend — React Static Site
  - type: web
    name: ai-study-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ai-study-backend
          type: web
          property: host
